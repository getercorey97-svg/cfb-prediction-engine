name: CFB Automated Pipeline & Self-Correction

on:
  schedule:
    # Runs Tuesday mornings at 06:00 UTC (post-game residual & calibration cycle)
    - cron: '0 6 * * 2'
  workflow_dispatch:

jobs:
  retrain_and_correct:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: 1. Ingest Data, Build DuckDB & Sync State
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python src/data_ingestion.py

      - name: 2. Execute Walk-Forward Backtesting Validation
        run: python src/self_correction.py --backtest --samples 300

      - name: 3. Execute Autonomous MAB Self-Correction Loop
        run: python src/self_correction.py --correct

      - name: 4. Commit Updated Parquet, DuckDB & State Files
        run: |
          git config --global user.name "CFB Engine Bot"
          git config --global user.email "engine@github.actions"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated data ingestion & self-correction update [skip ci]" && git push)
