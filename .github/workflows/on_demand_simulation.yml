name: CFB On-Demand Simulation

on:
  workflow_dispatch:
    inputs:
      home_team:
        description: 'Home Team'
        required: true
        type: string
        default: 'Georgia'
      away_team:
        description: 'Away Team'
        required: true
        type: string
        default: 'Alabama'
      qb_name:
        description: 'Home QB Name'
        required: false
        type: string
        default: 'Starting QB'
      rb_name:
        description: 'Home RB1 Name'
        required: false
        type: string
        default: 'Lead RB'
      wr_name:
        description: 'Home WR1 Name'
        required: false
        type: string
        default: 'Primary WR'
      rb_share:
        description: 'RB Carry Share % (e.g., 0.65 for 65%)'
        required: false
        type: number
        default: 0.62
      wr_share:
        description: 'WR Target Share % (e.g., 0.28 for 28%)'
        required: false
        type: number
        default: 0.26
      simulations:
        description: 'Monte Carlo Iterations'
        required: false
        type: number
        default: 50000

jobs:
  simulate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Execute 50k Prop Simulation Engine
        run: |
          python src/simulation_engine.py \
            --home "${{ inputs.home_team }}" \
            --away "${{ inputs.away_team }}" \
            --sims ${{ inputs.simulations }} \
            --qb-name "${{ inputs.qb_name }}" \
            --rb-name "${{ inputs.rb_name }}" \
            --wr-name "${{ inputs.wr_name }}" \
            --rb-share ${{ inputs.rb_share }} \
            --wr-share ${{ inputs.wr_share }} \
            --summary-file $GITHUB_STEP_SUMMARY
