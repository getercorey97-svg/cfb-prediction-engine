name: CFB On-Demand Simulation

on:
  workflow_dispatch:
    inputs:
      home_team:
        description: 'Home Team'
        required: true
        type: string
        default: 'Georgia'
      away_team:
        description: 'Away Team'
        required: true
        type: string
        default: 'Alabama'
      home_qb:
        description: 'Home QB Name'
        required: false
        type: string
        default: 'Carson Beck'
      home_rb:
        description: 'Home RB1 Name'
        required: false
        type: string
        default: 'Trevor Etienne'
      rb_share:
        description: 'RB1 Carry Share (e.g., 0.55)'
        required: false
        type: string
        default: '0.55'

jobs:
  simulate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run 50k Prop Simulation
        run: |
          python src/simulation_engine.py \
            --home "${{ inputs.home_team }}" \
            --away "${{ inputs.away_team }}" \
            --home-qb "${{ inputs.home_qb }}" \
            --home-rb "${{ inputs.home_rb }}" \
            --rb-share ${{ inputs.rb_share }} \
            --summary-file $GITHUB_STEP_SUMMARY
